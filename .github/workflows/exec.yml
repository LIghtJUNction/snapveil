# Generated by kam workflow install, then adapted for the companion APK and versioned ZIP.
name: Build SnapVeil

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: snapveil-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: MemDeco-WG/setup-kam@v3
        with:
          github-token: ${{ github.token }}
          kam-version: '0.6.14'
          cache-targets: cargo,kam
          install-commitizen: 'false'
          warn-private-key: 'false'
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build and inspect
        shell: bash
        run: |
          set -euo pipefail
          kam export prop src/snapveil/module.prop
          git diff --exit-code -- src/snapveil/module.prop
          sh android/tests/run.sh
          python3 -m unittest discover -s tests -v
          kam build --release
          python3 tools/verify.py
          cp src/snapveil/app/snapveil.apk dist/snapveil.apk
          (cd dist && sha256sum *.zip *.apk > SHA256SUMS)
      - name: Upload development build
        uses: actions/upload-artifact@v7
        with:
          name: snapveil-development-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
