# Kam-built module: normal pushes/PRs test only. Manual runs can bump and publish.
name: Build SnapVeil

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump (none keeps the existing version)'
        type: choice
        required: true
        default: none
        options:
          - none
          - patch
          - minor
          - major
      release:
        description: 'Publish a GitHub Release after tests (requires APK signing secrets)'
        type: boolean
        required: true
        default: false
      prerelease:
        description: 'Mark the published Release as a prerelease'
        type: boolean
        required: true
        default: false
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Do not cancel a version bump halfway through its commit/tag/release sequence.
concurrency:
  group: snapveil-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - name: Validate manual release request
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          BUMP_MODE: ${{ inputs.bump }}
          PUBLISH_RELEASE: ${{ inputs.release }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          case "$BUMP_MODE" in none|patch|minor|major) ;; *) echo 'Invalid bump choice' >&2; exit 2;; esac
          if [[ "$PRERELEASE" == 'true' && "$PUBLISH_RELEASE" != 'true' ]]; then
            echo '::error::Prerelease requires release=true'
            exit 1
          fi
          if [[ ( "$BUMP_MODE" != 'none' || "$PUBLISH_RELEASE" == 'true' ) && "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo '::error::Version updates and releases must run from main'
            exit 1
          fi
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: MemDeco-WG/setup-kam@v3
        with:
          github-token: ${{ github.token }}
          kam-version: '0.6.14'
          cache-targets: cargo,kam
          install-commitizen: 'false'
          warn-private-key: 'false'
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Bump module version
        if: github.event_name == 'workflow_dispatch' && inputs.bump != 'none'
        shell: bash
        env:
          BUMP_MODE: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          python3 tools/bump.py "$BUMP_MODE"
          git add kam.toml src/snapveil/module.prop
          git diff --cached --check
      - name: Build and inspect
        shell: bash
        run: |
          set -euo pipefail
          kam export prop src/snapveil/module.prop
          git diff --exit-code -- src/snapveil/module.prop
          kam validate
          kam check --fail-on-error
          sh android/tests/run.sh
          python3 -m unittest discover -s tests -v
          # The module ZIP needs no signature. build_apk.py auto-signs the
          # required LSPosed companion APK with a local development key.
          kam build --release
          python3 tools/verify.py
          if [[ "${{ github.event_name }}" == workflow_dispatch && "${{ inputs.release }}" == true ]]; then
            echo '::warning::The module ZIP is unsigned. The companion APK uses a new development certificate on each runner; Android may require uninstalling the old companion app before upgrading.'
          fi
          cp src/snapveil/app/snapveil.apk dist/snapveil.apk
          (cd dist && sha256sum snapveil-*.zip snapveil.apk > SHA256SUMS)
          if [[ "${{ github.event_name }}" == 'workflow_dispatch' && '${{ inputs.bump }}' != 'none' ]]; then
            git diff --cached --binary -- kam.toml src/snapveil/module.prop > dist/bump.patch
            test -s dist/bump.patch
          fi
      - name: Record module version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("kam.toml", "rb"))["prop"]["version"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Upload verified build
        uses: actions/upload-artifact@v7
        with:
          name: snapveil-build-${{ github.run_id }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Commit bump / Publish Release
    if: github.event_name == 'workflow_dispatch' && (inputs.bump != 'none' || inputs.release)
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Download verified build
        uses: actions/download-artifact@v7
        with:
          name: snapveil-build-${{ github.run_id }}
          path: dist
      - name: Commit version and publish requested release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP_MODE: ${{ inputs.bump }}
          PUBLISH_RELEASE: ${{ inputs.release }}
          PRERELEASE: ${{ inputs.prerelease }}
          BUILD_VERSION: ${{ needs.build.outputs.version }}
        run: bash tools/publish.sh
