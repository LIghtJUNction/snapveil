# Generated by kam workflow install, then reduced to this project's Java/shell checks.
name: Validate SnapVeil

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: snapveil-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: MemDeco-WG/setup-kam@v3
        with:
          github-token: ${{ github.token }}
          kam-version: '0.6.14'
          cache-targets: cargo,kam
          install-commitizen: 'false'
          warn-private-key: 'false'
      - name: Install shell checks
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Validate source and behavior
        shell: bash
        run: |
          set -euo pipefail
          kam validate
          kam check --fail-on-error
          kam export prop src/snapveil/module.prop
          git diff --exit-code -- src/snapveil/module.prop
          shellcheck -x -P . src/snapveil/*.sh src/snapveil/cli src/snapveil/lib/common.sh src/snapveil/META-INF/com/google/android/update-binary hooks/*/*.sh
          sh android/tests/run.sh
          python3 -m unittest discover -s tests -v
